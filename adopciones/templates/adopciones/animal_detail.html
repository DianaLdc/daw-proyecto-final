<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ animal.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'adopciones:animal_list' %}">🐾 Veterinaria Adopciones</a>
        </div>
    </nav>
    <div class="container mt-4">
        <div class="card">
            {% if animal.foto %}
            <img src="{{ animal.foto.url }}" class="card-img-top" alt="{{ animal.nombre }}">
            {% endif %}
            <div class="card-body">
                <h3 class="card-title">{{ animal.nombre }}</h3>
                <p><strong>Especie:</strong> {{ animal.especie }}</p>
                <p><strong>Raza:</strong> {{ animal.raza }}</p>
                <p><strong>Edad:</strong> {{ animal.edad }} años</p>
                <p><strong>Estado:</strong> {{ animal.estado }}</p>
                <p><strong>Descripción:</strong> {{ animal.descripcion }}</p>
                <a href="{% url 'adopciones:animal_list' %}" class="btn btn-secondary">Volver</a>
                <a href="{% url 'adopciones:animal_update' animal.pk %}" class="btn btn-warning">Editar</a>
                <a href="{% url 'adopciones:animal_delete' animal.pk %}" class="btn btn-danger">Borrar</a>
            </div>
        </div>
    </div>
</body>
</html>
