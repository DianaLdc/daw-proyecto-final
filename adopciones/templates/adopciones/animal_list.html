<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animales en Adopción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">🐾 Veterinaria Adopciones</a>
        </div>
    </nav>
    <div class="container mt-4">
        <h2>Animales disponibles</h2>
        <div class="row">
            <a href="{% url 'adopciones:animal_create' %}" class="btn btn-success mb-3">+ Agregar animal</a>
            {% for animal in animales %}
            <div class="col-md-4 mb-3">
                <div class="card">
                    {% if animal.foto %}
                    <img src="{{ animal.foto.url }}" class="card-img-top" alt="{{ animal.nombre }}">
                    {% endif %}
                    <div class="card-body">
                        <h5 class="card-title">{{ animal.nombre }}</h5>
                        <p class="card-text">{{ animal.especie }} - {{ animal.raza }}</p>
                        <p class="card-text">{{ animal.descripcion }}</p>
                        <a href="{% url 'adopciones:animal_detail' animal.pk %}" class="btn btn-primary">Ver más</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
